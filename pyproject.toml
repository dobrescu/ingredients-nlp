[project]
name = "ingredients-nlp"
version = "1.0.0"
description = "AWS Lambda service for parsing recipe ingredients"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--cov=src"]
